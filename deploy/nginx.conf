# Статика Evolution Car на VPS: отдаём из /srv/current (симлинк на текущую выкладку).
# Файл подключается в контейнер как /etc/nginx/conf.d/default.conf.
# Правила 301 со старых адресов Тильды – в redirects.conf, он генерируется
# из карты миграции скриптом scripts/gen-redirects.mjs.
include /etc/nginx/conf.d/redirects.conf;

server {
  listen 8080;
  server_tokens off;
  absolute_redirect off;
  root /srv/current;
  index index.html;

  # Старый адрес из карты миграции – 301 на новый. Проверяем раньше всего,
  # иначе try_files отдал бы 404 до того, как сработает правило.
  if ($redirect_target != "") {
    return 301 $redirect_target;
  }

  # Кабинет переехал на свой поддомен (правило владельца 28.10.2026).
  # Старый адрес оставляем переадресацией, чтобы прежние ссылки не ломались.
  # Запрос, пришедший с самого поддомена, не трогаем – там этот же каталог.
  # На поддомене префикс /admin/ подставляет Caddy, поэтому в переадресации
  # его нужно снять: /admin/metrika/ → admin.evolutioncar.by/metrika/.
  location ~ ^/admin(?<adminrest>/.*)?$ {
    if ($http_host !~* "^admin\.") {
      return 301 https://admin.evolutioncar.by$adminrest;
    }
    try_files $uri $uri/index.html =404;
  }

  # …/index.html → чистый адрес: иначе в индексе два адреса одной страницы
  location ~ ^(.*/)index\.html$ {
    return 301 $1;
  }

  # Адреса сайта – со слешем в конце, как в canonical и sitemap.
  # $uri/ отдельным аргументом не ставим: на /catalog/ nginx видит каталог
  # и отвечает 301 на тот же адрес – получается петля. Берём index.html явно.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Сборка Astro: имена файлов с хешем, можно кэшировать навсегда.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;
}
