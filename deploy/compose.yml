# Evolution Car на VPS Beget: статика + приёмник заявок + суточный сбор аналитики.
# Порты наружу не публикуются: общий Caddy ходит к контейнерам по сети proxy.
name: evolution-car
services:
  evolution-car-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: evolution-car-web
    restart: unless-stopped
    volumes:
      - /opt/evolution-car/releases:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./redirects.conf:/etc/nginx/conf.d/redirects.conf:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 96m
    networks: [proxy]

  # Заявки с форм сайта и отдача отчётов кабинету. Свой системный пользователь:
  # заявки с персональными данными не читает никто из других сервисов.
  evolution-car-api:
    image: node:22-alpine
    container_name: evolution-car-api
    restart: unless-stopped
    user: "10502:10502"
    working_dir: /app
    command: ["node", "lead.mjs"]
    env_file: [/opt/evolution-car/lead.env]
    volumes:
      - /opt/evolution-car/server:/app:ro
      - /opt/evolution-car/data:/data
      - /opt/evolution-car/analytics-out:/analytics:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    networks: [proxy]

  # Сбор отчётов кабинета раз в сутки: Метрика и Search Console → /out.
  # Контейнер просыпается по таймеру внутри себя и спит между прогонами.
  evolution-car-analytics:
    build: ../analytics
    image: evolution-car-analytics:latest
    container_name: evolution-car-analytics
    restart: unless-stopped
    user: "10502:10502"
    environment:
      OUT_DIR: /out
      SECRETS_DIR: /secrets
      METRIKA_COUNTER: "98499004"
      GSC_SITE_URL: "sc-domain:evolutioncar.by"
    volumes:
      - /opt/evolution-car/analytics-out:/out
      - /opt/evolution-car/secrets:/secrets:ro
    command: ["sh", "-c", "while true; do python3 collect.py daily || true; sleep 86400; done"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [proxy]

  # Заявки живут в одном файле на диске. Пока нет уведомлений в Telegram,
  # потеря этого файла = потеря всех обращений, поэтому раз в сутки делаем
  # копию с датой и держим последние 30. Копии лежат рядом, но отдельно:
  # случайная перезапись или чистка data их не заденет.
  evolution-car-backup:
    image: alpine:3.20
    container_name: evolution-car-backup
    restart: unless-stopped
    user: "10502:10502"
    volumes:
      - /opt/evolution-car/data:/data:ro
      - /opt/evolution-car/backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          if [ -s /data/leads.jsonl ]; then
            cp /data/leads.jsonl "/backups/leads-$$(date +%Y%m%d).jsonl"
            ls -1t /backups/leads-*.jsonl 2>/dev/null | tail -n +31 | xargs -r rm -f
          fi
          sleep 86400
        done
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 32m

networks:
  proxy:
    external: true
    name: dzenbot_default
