name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Сайт отдаётся с корня домена ликсианг.рф (в punycode — так требуют
      # GitHub Pages и браузеры), поэтому префикс подпапки больше не нужен.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://xn--80agnajes3a.xn--p1ai
      # Кабинет на зеркало НЕ публикуем. Решение владельца 08.11.2026: кабинет
      # должен быть один – admin.evolutioncar.by, за паролем. На Pages пароля
      # нет в принципе, и копия кабинета здесь открывалась любому, кто знает
      # адрес (ликсианг.рф/admin/ отвечал 200 – найдено при проверке).
      # Сборку Astro кабинет тоже кладёт в dist/admin, поэтому удаляем его
      # после сборки, а не только пропускаем старый шаг admin/build.py.
      - name: Убрать кабинет из публикации на зеркале
        run: |
          rm -rf dist/admin
          test ! -e dist/admin && echo "кабинета в сборке зеркала нет"
      - name: Запретить Jekyll обрабатывать сборку
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
